name: Deploy to Cloudflare

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://miwcxakzyforbahpnpst.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1pd2N4YWt6eWZvcmJhaHBucHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTkyNjIsImV4cCI6MjA5Njc5NTI2Mn0.lCVQOQvfHhQdrwj8wxSVk8T9XZhRGSxp2x9Ki1dMOMQ
          VITE_GOOGLE_OAUTH_CLIENT_ID: 1061365228370-gmpu651cf493frmc3ck8edhaopt7jjmd.apps.googleusercontent.com

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
